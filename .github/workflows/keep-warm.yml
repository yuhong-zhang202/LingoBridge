# 定时 ping 一个会触达 Supabase 的接口，保持 Zeabur 服务与「Zeabur→Supabase」连接池温热，
# 避免闲置后首个请求（点同意 / 开始录音 / 额度检查等）因冷连接重新 TLS 握手而慢几秒。
# ⚠️ GitHub 定时任务可能被延迟数分钟、且仓库 60 天无提交会自动停用；要更稳（5 分钟准点）
#    可另外用 cron-job.org / UptimeRobot（免费）打同一个 URL，二者不冲突。
name: keep-warm

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

concurrency:
  group: keep-warm
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    # 兜底：这个 job 的活儿只有两条 curl，正常十几秒结束。给 2 分钟上限是为了「卡住就快速失败」，
    # 而不是拖到被下一次调度取消 —— 见下方 --max-time 那段的说明。
    timeout-minutes: 2
    steps:
      - name: 预热 app + Supabase 连接池
        run: |
          # ⚠️ --max-time 必须有（2026-08-06 修）：原先两条 curl 都没设超时，
          # 生产站瞬时无响应时 curl 会一直等，5 分钟后被下一次调度按 cancel-in-progress 取消，
          # 而「被取消」在 GitHub 里记作 failure、发失败邮件。实际发生过一次，报告耗时 15 分钟
          # （连卡三个周期）。保活本身失败无所谓（下一班 5 分钟后就来），但它不该制造假警报。
          # 20 秒足够：这两个接口正常都在 1 秒级，超过 20 秒说明站点已经不是「冷」而是「有问题」，
          # 那种情况该由真实用户与看板发现，不该由保活任务用一封失败邮件来报。
          curl -fsS --max-time 20 -o /dev/null -w 'switch:  %{http_code}  %{time_total}s\n' \
            'https://lingobridge.zeabur.app/api/questions?mode=switch' || true
          curl -fsS --max-time 20 -o /dev/null -w 'version: %{http_code}  %{time_total}s\n' \
            'https://lingobridge.zeabur.app/api/version' || true
