<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LingoBridge · 我的（单栏分组 · v2）</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
:root{
  --bg-page:#FBFAF7; --surface:#FFFFFF; --muted:#EEEBE6; --inner:#F4F2EE;
  --primary:#D4875A; --primary-light:#F2D5C0; --primary-dark:#B5663A;
  --accent:#7BA699; --accent-light:#C8DDD9;
  --tx1:#2C2420; --tx2:#6B5B52; --tx3:#A89990;
  --danger:#B5663A;
  --grad:linear-gradient(135deg,rgba(240,188,160,.85),rgba(168,210,196,.80),rgba(188,210,168,.75));
  --shadow-sm:0 1px 6px rgba(60,40,30,.05);
  --sans:'Plus Jakarta Sans','PingFang SC','Noto Sans SC',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:var(--bg-page);color:var(--tx1);font-family:var(--sans);-webkit-font-smoothing:antialiased}

/* 顶部导航：与全站其它页共用 1200 宽容器 */
.nav-wrap{max-width:1200px;margin:0 auto;padding:0 64px}
.topbar{position:sticky;top:0;z-index:30;background:var(--bg-page);border-bottom:1px solid rgba(0,0,0,.045)}
.tb{display:flex;align-items:center;gap:34px;height:68px}
.logo{display:flex;align-items:center;gap:11px;font-weight:700;font-size:18px}
.logo .m{width:38px;height:38px;border-radius:11px;background:var(--primary);display:grid;place-items:center;color:#fff}
.nav{display:flex;gap:6px}
.nav a{font-size:15px;color:var(--tx2);text-decoration:none;font-weight:500;padding:7px 14px;border-radius:999px}
.nav a.on{background:var(--muted);color:var(--tx1);font-weight:600}
.right{margin-left:auto;display:flex;align-items:center;gap:16px}
.iconbtn{width:38px;height:38px;border-radius:999px;border:none;background:transparent;color:var(--tx2);display:grid;place-items:center;cursor:pointer}
.iconbtn:hover{background:var(--muted)}
.ava-nav{width:38px;height:38px;border-radius:999px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:600;font-size:14px}

/* 账户内容区：单栏居中，比 Dashboard 页更窄（参考 Notion/GitHub/Linear 账户设置页）*/
.account{max-width:720px;margin:0 auto;padding:0 32px}

.head{padding:24px 0 20px;display:flex;align-items:center;justify-content:space-between}
.crumb{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--tx3)}
.crumb .cur{color:var(--tx2);font-weight:500}
.head h1{font-size:24px;font-weight:700;letter-spacing:-.01em;margin-top:8px}
.settings-btn{width:40px;height:40px;border-radius:999px;border:1px solid rgba(0,0,0,.08);background:var(--surface);color:var(--tx2);display:grid;place-items:center;cursor:pointer}
.settings-btn:hover{background:var(--muted)}

.panel{background:var(--surface);border:1px solid rgba(0,0,0,.06);border-radius:16px;box-shadow:var(--shadow-sm)}
.panel.grad{border:1.5px solid transparent;background:linear-gradient(var(--surface),var(--surface)) padding-box,var(--grad) border-box}
.panel-pad{padding:22px 24px}
.stack{display:flex;flex-direction:column;gap:16px;padding-bottom:64px}

/* 身份卡：头像 + 邮箱 + 三统计一行 */
.orb-frame{
  width:64px;height:64px;border-radius:999px;flex-shrink:0;overflow:hidden;position:relative;
  background:var(--surface);border:1px solid rgba(0,0,0,.06);
}
.orb-frame .blob i{position:absolute;border-radius:50%;filter:blur(14px)}
.blob .green{width:50px;height:50px;left:7px;top:1px;background:radial-gradient(circle,rgba(145,200,122,.9),transparent 70%)}
.blob .blue{width:44px;height:44px;right:1px;top:14px;background:radial-gradient(circle,rgba(112,182,176,.9),transparent 70%)}
.blob .orange{width:46px;height:46px;left:15px;bottom:0px;background:radial-gradient(circle,rgba(248,168,118,.85),transparent 70%)}
.pf-row{display:flex;align-items:center;gap:16px}
.pf-info{flex:1;min-width:0}
.pf-info .email{font-size:16px;font-weight:600;color:var(--tx1)}
.pf-info .sub{font-size:12.5px;color:var(--tx3);margin-top:3px}
.pf-stats{display:flex;gap:8px}
.pf-stat{background:var(--inner);border-radius:11px;padding:10px 16px;text-align:center;min-width:72px}
.pf-stat.streak{background:linear-gradient(135deg,rgba(212,135,90,.10),rgba(212,135,90,.04))}
.pf-stat .v{font-size:17px;font-weight:700;color:var(--tx1);display:flex;align-items:baseline;justify-content:center;gap:3px}
.pf-stat .v .unit{font-size:11px;font-weight:400;color:var(--tx3)}
.pf-stat .k{font-size:11px;color:var(--tx3);margin-top:2px}
.pf-stat .flame{color:var(--primary);display:inline-flex}

/* 本月额度 */
.sec-h{display:flex;align-items:center;gap:8px;margin-bottom:2px}
.sec-h .ic{color:var(--primary);display:inline-flex}
.sec-h h2{font-size:15px;font-weight:700;flex:1}
.sec-h .meta{font-size:12px;color:var(--tx3)}
.quota-row{display:flex;align-items:center;justify-content:space-between;margin-top:16px}
.quota-name{font-size:14px;font-weight:600;color:var(--tx1)}
.quota-val{font-size:13px;color:var(--tx3)}
.quota-bar{height:6px;border-radius:3px;background:var(--muted);margin-top:8px;overflow:hidden}
.quota-bar i{display:block;height:100%;border-radius:3px;background:var(--primary)}

/* 分组列表：像 Notion / GitHub / Linear 账户设置那样，小号灰色分组标签 + 组内行 + 组间分隔 */
.group-label{font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--tx3);padding:16px 24px 8px}
.group-label:first-child{padding-top:18px}
.list-item{display:flex;align-items:center;gap:12px;padding:13px 24px;cursor:pointer;transition:background .12s;border-top:1px solid rgba(0,0,0,.05)}
.list-item:hover{background:var(--inner)}
.list-item .ic{width:32px;height:32px;border-radius:9px;background:var(--inner);color:var(--tx2);display:grid;place-items:center;flex-shrink:0}
.list-item .t{flex:1;font-size:14.5px;font-weight:500;color:var(--tx1)}
.list-item .n{font-size:13px;color:var(--tx3)}
.list-item .v{font-size:12.5px;color:var(--tx3)}
.list-item .chev{color:var(--tx3);flex-shrink:0}
.list-item.danger .t{color:var(--danger)}
.list-item.danger .ic{color:var(--danger)}
.list-item.danger:hover{background:rgba(181,102,58,.06)}

@media (max-width:640px){
  .nav-wrap{padding:0 20px}
  .account{padding:0 16px}
  .nav{display:none}
  .pf-row{flex-wrap:wrap}
  .pf-stats{width:100%}
  .pf-stat{flex:1}
}
</style>
</head>
<body>

<header class="topbar"><div class="nav-wrap tb">
  <div class="logo"><span class="m"><i data-lucide="mic" width="20" height="20"></i></span>LingoBridge</div>
  <nav class="nav"><a href="#">首页</a><a href="#">题库</a><a href="#">素材库</a><a href="#" class="on">我的</a></nav>
  <div class="right">
    <button class="iconbtn" aria-label="通知"><i data-lucide="bell" width="20" height="20"></i></button>
    <div class="ava-nav">B</div>
  </div>
</div></header>

<div class="account">
  <div class="head">
    <div>
      <div class="crumb"><span>首页</span><i data-lucide="chevron-right" width="14" height="14"></i><span class="cur">我的</span></div>
      <h1>我的</h1>
    </div>
    <button class="settings-btn" aria-label="设置"><i data-lucide="settings" width="18" height="18"></i></button>
  </div>

  <div class="stack">
    <!-- 身份卡 -->
    <div class="panel grad panel-pad">
      <div class="pf-row">
        <div class="orb-frame"><div class="blob"><i class="green"></i><i class="blue"></i><i class="orange"></i></div></div>
        <div class="pf-info">
          <div class="email">b***@hotmail.com</div>
          <div class="sub">已收集 3 段语料</div>
        </div>
        <div class="pf-stats">
          <div class="pf-stat streak">
            <div class="v"><span class="flame"><i data-lucide="flame" width="15" height="15"></i></span>0<span class="unit">天</span></div>
            <div class="k">连续打卡</div>
          </div>
          <div class="pf-stat"><div class="v">3</div><div class="k">语料</div></div>
          <div class="pf-stat"><div class="v">0</div><div class="k">练习</div></div>
        </div>
      </div>
    </div>

    <!-- 本月额度 -->
    <div class="panel panel-pad">
      <div class="sec-h"><span class="ic"><i data-lucide="gauge" width="17" height="17"></i></span><h2>本月额度</h2><span class="meta">8 月 1 日重置</span></div>
      <div class="quota-row"><span class="quota-name">故事练习</span><span class="quota-val">0 / 10</span></div>
      <div class="quota-bar"><i style="width:0%"></i></div>
      <div class="quota-row"><span class="quota-name">题目练习</span><span class="quota-val">0 / 10</span></div>
      <div class="quota-bar"><i style="width:0%"></i></div>
    </div>

    <!-- 分组列表：我的内容 / 支持 / 账户 -->
    <div class="panel">
      <div class="group-label">我的内容</div>
      <div class="list-item">
        <span class="ic"><i data-lucide="bookmark" width="16" height="16"></i></span>
        <span class="t">收藏的卡片</span>
        <span class="n">0</span>
        <span class="chev"><i data-lucide="chevron-right" width="16" height="16"></i></span>
      </div>
      <div class="list-item">
        <span class="ic"><i data-lucide="history" width="16" height="16"></i></span>
        <span class="t">练习历史</span>
        <span class="chev"><i data-lucide="chevron-right" width="16" height="16"></i></span>
      </div>

      <div class="group-label">支持</div>
      <div class="list-item">
        <span class="ic"><i data-lucide="circle-help" width="16" height="16"></i></span>
        <span class="t">帮助与反馈</span>
        <span class="chev"><i data-lucide="chevron-right" width="16" height="16"></i></span>
      </div>
      <div class="list-item">
        <span class="ic"><i data-lucide="info" width="16" height="16"></i></span>
        <span class="t">关于 LingoBridge</span>
        <span class="v">v0.6.0</span>
        <span class="chev"><i data-lucide="chevron-right" width="16" height="16"></i></span>
      </div>

      <div class="group-label">账户</div>
      <div class="list-item danger">
        <span class="ic"><i data-lucide="log-out" width="16" height="16"></i></span>
        <span class="t">退出登录</span>
      </div>
    </div>
  </div>
</div>

<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<script>if(window.lucide)lucide.createIcons();</script>
</body>
</html>
