    border-radius: inherit;
    padding: 1px;
    background: linear-gradient(135deg, rgba(240,188,160,0.85) 0%, rgba(168,210,196,0.80) 50%, rgba(188,210,168,0.75) 100%);

    pointer-events: none;

  .task-card { transition: transform 150ms ease, box-shadow 150ms ease; }

        <div>
          <label class="text-[12px] text-v2-text-secondary mb-1.5 block">新密码</label>
          <input type="password" class="w-full h-[40px] px-3.5 rounded-[10px] border border-black/[0.1] text-[13px] outline-none focus:border-brand-primary" placeholder="至少 8 位字符">
        </div>
        <div>
          <label class="text-[12px] text-v2-text-secondary mb-1.5 block">确认新密码</label>
          <input type="password" class="w-full h-[40px] px-3.5 rounded-[10px] border border-black/[0.1] text-[13px] outline-none focus:border-brand-primary" placeholder="再次输入新密码">
        </div>
      </div>
      <button class="w-full mt-5 py-3 rounded-full text-[14px] font-medium text-v2-text-secondary gradient-border bg-white active:scale-[0.97] transition-transform">
        保存修改
      </button>
    </div>
  </div>

  <!-- 弹窗：意见反馈 -->
  <div id="modal-feedback" class="hidden fixed inset-0 bg-black/30 modal-backdrop flex items-center justify-center z-50 px-4">
    <div class="bg-bg-surface rounded-[16px] w-full max-w-[380px] p-6 shadow-[0_20px_50px_rgba(0,0,0,0.15)]">
      <div class="flex items-center justify-between mb-5">
        <span class="text-[15px] font-semibold">意见反馈</span>
        <button onclick="document.getElementById('modal-feedback').classList.add('hidden')" class="text-v2-text-muted hover:text-v2-text-primary">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <label class="text-[12px] text-v2-text-secondary mb-1.5 block">告诉我们哪里不好用，或者你希望我们做什么</label>
      <textarea rows="5" class="w-full px-3.5 py-3 rounded-[10px] border border-black/[0.1] text-[13px] outline-none focus:border-brand-primary resize-none" placeholder="写下你的想法…"></textarea>
      <button class="w-full mt-4 py-3 rounded-full text-[14px] font-medium text-v2-text-secondary gradient-border bg-white active:scale-[0.97] transition-transform">
        提交反馈
      </button>
    </div>
  </div>

</body>
</html>
